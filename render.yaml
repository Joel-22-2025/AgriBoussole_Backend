services:
  - type: web
    name: agriboussole-backend
    runtime: python
    plan: free
    rootDir: .
    pythonVersion: "3.12.7"
    buildCommand: bash build.sh
    startCommand: cd backend && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120 --access-logfile -
    healthCheckPath: /api/schema/
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: agriboussole-db
          property: connectionString
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "False"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: cley_grok
        sync: false
      - key: DEFAULT_SUPERADMIN_EMAIL
        sync: false
      - key: DEFAULT_SUPERADMIN_PASSWORD
        sync: false
      - key: DATA_FIXTURE_URL
        sync: false
      - key: DEFAULT_FROM_EMAIL
        value: "saei-orientation@example.com"

databases:
  - name: agriboussole-db
    plan: free
